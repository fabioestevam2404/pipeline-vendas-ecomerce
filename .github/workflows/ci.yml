name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (black --check)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Testes unitários e de integração
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pytest tests/unit tests/integration --cov=src --cov-report=term-missing

      - name: Detecção de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - name: Análise de dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-validation:
    name: Validacao Docker (build + compose up real)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar .env com valores gerados em tempo de execucao (nunca commitados)
        run: |
          FERNET_KEY=$(python3 -c "import secrets, base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          PG_PASSWORD=$(openssl rand -hex 16)
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          cat > .env << EOF
          POSTGRES_USER=pipeline_user
          POSTGRES_PASSWORD=${PG_PASSWORD}
          POSTGRES_DB=vendas_ecommerce
          POSTGRES_PORT=5432
          RAW_DATA_DIR=./data/raw
          LANDING_ZONE_DIR=./data/landing
          QUARANTINE_DIR=./data/quarantine
          AIRFLOW_UID=50000
          AIRFLOW_ADMIN_USER=admin
          AIRFLOW_ADMIN_PASSWORD=${ADMIN_PASSWORD}
          AIRFLOW_FERNET_KEY=${FERNET_KEY}
          AIRFLOW_WEBSERVER_PORT=8080
          EOF

      - name: Validar sintaxe do docker-compose.yml (docker compose real)
        run: docker compose config -q

      - name: Build da imagem da aplicacao
        run: docker build -t pipeline-vendas:latest .

      - name: Subir Postgres e app
        run: docker compose up -d postgres app

      - name: Aguardar Postgres saudavel
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' pipeline-vendas-postgres 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "Postgres saudavel"
              break
            fi
            echo "Aguardando Postgres... ($i/30)"
            sleep 2
          done

      - name: Rodar a suite de testes dentro do container app
        run: docker compose exec -T app pytest tests/unit tests/integration -q

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar containers
        if: always()
        run: docker compose down --volumes